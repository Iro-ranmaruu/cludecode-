<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WiSM製品アプリ（単体版）</title>
<style>
  :root {
    --ink: #17202e;
    --ink-soft: #4b5566;
    --paper: #f3f5f8;
    --surface: #ffffff;
    --line: #dde2ea;
    --line-soft: #eaedf2;
    --accent: #2c4c8c;
    --accent-ink: #1d3564;
    --accent-soft: #e8edf8;
    --accent-soft-line: #cdd9ee;
    --good: #1c7a4d;
    --good-soft: #e4f4ea;
    --warn: #935b12;
    --warn-soft: #fbeed9;
    --bad: #ab2a2a;
    --bad-soft: #fbe6e6;
    --info: #2a6f8a;
    --info-soft: #e4f2f6;
    --shadow-sm: 0 1px 2px rgba(23, 32, 46, 0.06);
    --shadow-md: 0 6px 20px rgba(23, 32, 46, 0.08);
    --radius: 10px;
  }
  :root[data-theme="dark"] {
    --ink: #e8ecf3; --ink-soft: #a7b0c0; --paper: #121722; --surface: #1a2130;
    --line: #2c3547; --line-soft: #232c3d; --accent: #7ea0dd; --accent-ink: #cfdcf5;
    --accent-soft: #1f2c47; --accent-soft-line: #33456e; --good: #5cc891; --good-soft: #163828;
    --warn: #e0a94f; --warn-soft: #3a2c12; --bad: #e58080; --bad-soft: #3a1f1f;
    --info: #7ec2dc; --info-soft: #17303a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow-md: 0 10px 28px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e8ecf3; --ink-soft: #a7b0c0; --paper: #121722; --surface: #1a2130;
      --line: #2c3547; --line-soft: #232c3d; --accent: #7ea0dd; --accent-ink: #cfdcf5;
      --accent-soft: #1f2c47; --accent-soft-line: #33456e; --good: #5cc891; --good-soft: #163828;
      --warn: #e0a94f; --warn-soft: #3a2c12; --bad: #e58080; --bad-soft: #3a1f1f;
      --info: #7ec2dc; --info-soft: #17303a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow-md: 0 10px 28px rgba(0,0,0,.45);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); min-height: 100%;
    display: flex; flex-direction: column;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased; font-feature-settings: "palt" 1;
  }
  ::selection { background: var(--accent-soft-line); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  header { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  header::after { content: ""; display: block; height: 3px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-soft-line) 55%, transparent 100%); }
  .header-inner { max-width: 1040px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: .01em; text-decoration: none; color: var(--ink); cursor: pointer; }
  .brand .mark { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--accent); transform: translateY(-1px); }
  nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  nav a, nav button.navlink { padding: 7px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink-soft); text-decoration: none; cursor: pointer; background: none; border: none; font-family: inherit; transition: background .15s ease, color .15s ease; }
  nav a:hover, nav button.navlink:hover { color: var(--ink); background: var(--line-soft); }
  .nav-user { font-size: 12.5px; color: var(--ink-soft); padding: 0 6px; white-space: nowrap; }
  .nav-divider { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
  .logout-btn { border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--ink-soft); background: var(--surface); cursor: pointer; font-family: inherit; }
  .logout-btn:hover { border-color: var(--accent-soft-line); color: var(--ink); }

  main { max-width: 1040px; margin: 0 auto; padding: 40px 24px 56px; width: 100%; flex: 1; }
  .center-main { display: flex; align-items: center; justify-content: center; flex: 1; padding: 40px 24px; }

  h1 { font-size: 21px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; text-wrap: balance; }
  h2 { font-size: 14px; font-weight: 700; margin: 0; letter-spacing: -.005em; }
  .muted { color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
  .muted-xs { color: var(--ink-soft); font-size: 12px; line-height: 1.6; }

  .module-grid { display: grid; gap: 20px; margin-top: 36px; }
  @media (min-width: 640px) { .module-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 900px) { .module-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .module-card { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm); }
  .module-card h2 { font-size: 15px; }
  .module-card .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .module-card .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  section.panel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }

  .field-label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; letter-spacing: .01em; }
  .required { color: var(--bad); margin-left: 2px; }
  input[type="text"], input[type="date"], input[type="number"], input[type="password"], select, textarea {
    width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 7px; padding: 7px 10px; font-size: 13.5px; font-family: inherit; box-shadow: var(--shadow-sm);
  }
  input::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: .7; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type="number"] { font-variant-numeric: tabular-nums; }
  .radio-row { display: flex; flex-wrap: wrap; gap: 6px 18px; padding-top: 4px; }
  .radio-row label { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink); cursor: pointer; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 640px) { .grid.cols-3 { grid-template-columns: repeat(3, 1fr); } .grid.cols-4 { grid-template-columns: repeat(4, 1fr); } }

  .item-row { border: 1px solid var(--line); border-radius: 9px; padding: 16px; margin-bottom: 14px; background: var(--paper); }
  .item-row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .item-row-head span.title { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }

  .link-btn { background: none; border: none; padding: 0; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--accent); font-family: inherit; }
  .link-btn:hover { color: var(--accent-ink); }
  .link-btn.danger { color: var(--bad); }
  .link-btn.danger:hover { color: #7d1c1c; }

  .btn { border-radius: 7px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: background .15s ease, border-color .15s ease, transform .05s ease; font-family: inherit; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; padding: 10px 22px; font-size: 13.5px; }
  .btn-primary:hover { background: var(--accent-ink); }
  .btn-secondary { background: var(--surface); border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; font-size: 12.5px; }
  .btn-secondary:hover { border-color: var(--accent-soft-line); background: var(--accent-soft); }
  .btn-block { width: 100%; text-align: center; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .add-row-btn { margin-top: 6px; }

  .checkbox-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .actions-right { display: flex; justify-content: flex-end; gap: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead { background: var(--paper); text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); }
  th, td { padding: 11px 16px; border-bottom: 1px solid var(--line-soft); }
  td { font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--accent-soft); }
  .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; overflow-x: auto; background: var(--surface); box-shadow: var(--shadow-sm); }
  .empty-box { border: 1px dashed var(--line); background: var(--surface); border-radius: var(--radius); padding: 40px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 11px 3px 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .badge.submitted { background: var(--warn-soft); color: var(--warn); }
  .badge.in_progress { background: var(--info-soft); color: var(--info); }
  .badge.completed { background: var(--good-soft); color: var(--good); }
  .badge.approved { background: var(--good-soft); color: var(--good); }
  .badge.rejected { background: var(--bad-soft); color: var(--bad); }
  .badge.partially_approved { background: var(--info-soft); color: var(--info); }
  .badge.decision-未決定 { background: var(--line-soft); color: var(--ink-soft); }
  .badge.decision-承認 { background: var(--good-soft); color: var(--good); }
  .badge.decision-却下 { background: var(--bad-soft); color: var(--bad); }
  .badge.decision-金額変更 { background: var(--info-soft); color: var(--info); }

  .banner-success { margin-bottom: 22px; border: 1px solid var(--good); background: var(--good-soft); color: var(--good); padding: 12px 16px; border-radius: 9px; font-size: 13.5px; font-weight: 600; }
  .banner-error { margin-bottom: 16px; border: 1px solid var(--bad); background: var(--bad-soft); color: var(--bad); padding: 10px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 600; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px; font-size: 13px; font-weight: 600; color: var(--ink-soft); text-decoration: none; }
  .back-link:hover { color: var(--accent); }

  .detail-title-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 22px; }

  dl.info-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, 1fr); margin: 14px 0 0; }
  @media (min-width: 640px) { dl.info-grid.cols-3 { grid-template-columns: repeat(3, 1fr); } dl.info-grid.cols-4 { grid-template-columns: repeat(4, 1fr); } }
  dl.info-grid dt { font-size: 11px; font-weight: 600; color: var(--ink-soft); letter-spacing: .01em; }
  dl.info-grid dd { margin: 3px 0 0; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: pre-wrap; }

  .item-detail-card { border: 1px solid var(--line); border-radius: 9px; padding: 16px; margin-bottom: 14px; background: var(--paper); }
  .item-detail-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .item-detail-head .name { font-size: 13.5px; font-weight: 700; }

  .decision-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
  .decision-form .field { display: flex; flex-direction: column; gap: 4px; }
  .decision-form select, .decision-form input, .decision-form textarea { padding: 5px 8px; font-size: 12.5px; }
  .decision-form input.price { width: 120px; }
  .decision-form textarea { width: 260px; }

  .notice { max-width: 1040px; margin: 0 auto; padding: 12px 24px 20px; font-size: 12.5px; line-height: 1.7; color: var(--ink-soft); }
  .notice strong { color: var(--ink); }

  .auth-card { width: 100%; max-width: 380px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow-md); }
  .auth-card h1 { font-size: 18px; }
  .auth-form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .demo-hint { margin: 0 0 16px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent-soft-line); color: var(--accent-ink); font-size: 12.5px; line-height: 1.6; }
  .demo-hint strong { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="brand" data-link href="#/"><span class="mark"></span>WiSM製品アプリ</a>
    <nav id="nav-area"></nav>
  </div>
</header>
<main id="app"></main>
<p class="notice">
  <strong>これはプレビュー用の単体デモです。</strong>Node.js不要でブラウザだけで動作し、データはこのブラウザの localStorage にのみ保存されます（他の人・他の端末とは共有されません）。ログイン情報も同じ仕組みで保存しているだけの簡易デモで、実運用のセキュリティはありません。操作感の確認用にご利用ください。
</p>

<script>
(function () {
  "use strict";

  // ================= Utilities =================

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function esc(v) {
    if (v === null || v === undefined) return "";
    return String(v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function numOrNull(v) {
    if (v === null || v === undefined || String(v).trim() === "") return null;
    var n = Number(v);
    return isNaN(n) ? null : n;
  }

  function fmtNum(n) {
    if (n === null || n === undefined) return "-";
    return Number(n).toLocaleString("ja-JP");
  }

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function makeStore(storageKey) {
    return {
      load: function () {
        try {
          var raw = localStorage.getItem(storageKey);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      },
      save: function (list) { localStorage.setItem(storageKey, JSON.stringify(list)); },
      get: function (id) { return this.load().find(function (r) { return r.id === id; }) || null; },
      upsert: function (req) {
        var list = this.load();
        var idx = list.findIndex(function (r) { return r.id === req.id; });
        if (idx >= 0) list[idx] = req; else list.unshift(req);
        this.save(list);
      }
    };
  }

  function setupRepeatableList(container, addBtn, templateFn, labelPrefix) {
    function renumber() {
      var rows = container.querySelectorAll("[data-item-row]");
      rows.forEach(function (row, i) {
        var titleEl = row.querySelector(".title");
        if (titleEl) titleEl.textContent = labelPrefix + " " + (i + 1);
        var btn = row.querySelector("[data-remove-item]");
        if (btn) btn.style.visibility = rows.length > 1 ? "visible" : "hidden";
      });
    }
    addBtn.addEventListener("click", function () {
      var wrapper = document.createElement("div");
      wrapper.innerHTML = templateFn(container.querySelectorAll("[data-item-row]").length);
      var newRow = wrapper.firstElementChild;
      container.appendChild(newRow);
      wireProductLookup(newRow);
      renumber();
    });
    container.addEventListener("click", function (e) {
      if (e.target.matches("[data-remove-item]")) {
        var rows = container.querySelectorAll("[data-item-row]");
        if (rows.length > 1) {
          e.target.closest("[data-item-row]").remove();
          renumber();
        }
      }
    });
    container.querySelectorAll("[data-item-row]").forEach(wireProductLookup);
    renumber();
  }

  // ================= Auth =================

  var USERS_KEY = "wism_app_users_v1";
  var SESSION_KEY = "wism_app_session_v1";

  function loadUsers() {
    try {
      var raw = localStorage.getItem(USERS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveUsers(list) { localStorage.setItem(USERS_KEY, JSON.stringify(list)); }
  function findUserByEmployeeNumber(num) {
    return loadUsers().find(function (u) { return u.employeeNumber === num; }) || null;
  }
  function verifyLogin(num, password) {
    var user = findUserByEmployeeNumber(num);
    if (!user || user.password !== password) return null;
    return user;
  }
  function setSession(userId) { localStorage.setItem(SESSION_KEY, userId); }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }
  function getCurrentUser() {
    var id = localStorage.getItem(SESSION_KEY);
    if (!id) return null;
    return loadUsers().find(function (u) { return u.id === id; }) || null;
  }
  function isPlanning(user) { return !!user && user.role === "企画"; }

  function seedDemoUsersIfMissing() {
    var demoUsers = [
      { employeeNumber: "4908", password: "wism4908", name: "飯田 彩葉", branchName: "ムトウWiSM製品企画販売部", role: "営業" },
      { employeeNumber: "9001", password: "wism9001", name: "武藤 賢三", branchName: "WiSM製品企画販売部", role: "企画" }
    ];
    var list = loadUsers();
    var changed = false;
    demoUsers.forEach(function (u) {
      if (list.some(function (existing) { return existing.employeeNumber === u.employeeNumber; })) return;
      list.push({
        id: uid(), employeeNumber: u.employeeNumber, password: u.password, name: u.name,
        branchName: u.branchName, role: u.role, createdAt: new Date().toISOString()
      });
      changed = true;
    });
    if (changed) saveUsers(list);
  }

  function lookupProductName(makerCode, productCode) {
    var mc = (makerCode || "").trim();
    var pc = (productCode || "").trim();
    if (!mc || !pc) return null;
    var name = PRODUCT_MASTER_MAP[mc + "|" + pc];
    return name || null;
  }
  function wireProductLookup(row) {
    var makerInput = row.querySelector('[data-field="makerCode"]');
    var productInput = row.querySelector('[data-field="productCode"]');
    var nameInput = row.querySelector('[data-field="productName"]');
    if (!makerInput || !productInput || !nameInput) return;
    var handler = function () {
      var name = lookupProductName(makerInput.value, productInput.value);
      if (name) nameInput.value = name;
    };
    makerInput.addEventListener("blur", handler);
    productInput.addEventListener("blur", handler);
  }

  function computeTokkaStatus(items) {
    if (!items.length) return "submitted";
    if (items.some(function (i) { return i.decision === "未決定"; })) return "submitted";
    if (items.every(function (i) { return i.decision === "承認"; })) return "approved";
    if (items.every(function (i) { return i.decision === "却下"; })) return "rejected";
    return "partially_approved";
  }

      e.preventDefault();
      var form = e.target;
      var itemRows = itemList.querySelectorAll("[data-item-row]");
      var items = []; var hasError = false;
      itemRows.forEach(function (row) {
        var get = function (f) { return row.querySelector('[data-field="' + f + '"]'); };
        var productName = get("productName").value.trim();
        var standard = get("standardWholesalePrice").value;
        var desired = get("desiredWholesalePrice").value;
        var anyValue = ["productName","makerCode","productCode","deliveryPrice","standardWholesalePrice","desiredWholesalePrice","monthlyAvgSales","productAbbreviation"]
          .some(function (f) { return get(f).value.trim() !== ""; });
        if (!anyValue) return;
        if (!productName || standard === "" || desired === "") { hasError = true; return; }
        items.push({
          id: uid(), productName: productName, makerCode: get("makerCode").value.trim(), productCode: get("productCode").value.trim(),
          deliveryPrice: numOrNull(get("deliveryPrice").value), standardWholesalePrice: numOrNull(standard), desiredWholesalePrice: numOrNull(desired),

          deliveryStartDate: get("deliveryStartDate").value, registerSpecialPrice: get("registerSpecialPrice").value,
          endDate: get("endDate").value, productAbbreviation: get("productAbbreviation").value.trim(),
          decision: "未決定", decidedWholesalePrice: null
        });

      var ccInputs = Array.prototype.filter.call(ccList.querySelectorAll("[data-cc-input]"), function (el) { return el.value.trim() !== ""; });
      if (ccInputs.some(function (el) { return !/^[0-9A-Za-z]{6}$/.test(el.value.trim()); })) { alert("得意先コードは半角英数字6桁で入力してください。"); return; }
      var customerCodes = ccInputs.map(function (el) { return el.value.trim().toUpperCase() + "00"; });

      var fd = new FormData(form);
      var req = {
        id: uid(), createdBy: user.id, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
        applicationDate: fd.get("applicationDate"), branchName: fd.get("branchName"), branchCode: fd.get("branchCode"),
        supervisorName: fd.get("supervisorName"), staffName: fd.get("staffName"), employeeNumber: fd.get("employeeNumber"),
        customerFacilityName: fd.get("customerFacilityName"), deliveryDepartment: fd.get("deliveryDepartment"), customerCodes: customerCodes,
        competitorMakerName: fd.get("competitorMakerName"), competitorProductName: fd.get("competitorProductName"),
        competitorProductCode: fd.get("competitorProductCode"), competitorJanCode: fd.get("competitorJanCode"),
        competitorPurchasePrice: fd.get("competitorPurchasePrice"), competitorDeliveryPrice: fd.get("competitorDeliveryPrice"),
        competitorVendor: fd.get("competitorVendor"), reasonType: fd.get("reasonType"), specialNotes: fd.get("specialNotes"),
        planningRemarks: "", status: "submitted", items: items
      };
      tokkaStore.upsert(req);
      location.hash = "#/tokka/requests/" + req.id + "?submitted=1";
    });
  }

        '<a data-link href="#/sample/new" class="btn btn-primary" style="text-decoration:none; display:inline-block;">+ 新規申請</a>' +

      (requests.length === 0
        ? '<div class="empty-box">まだ申請がありません。</div>'
        : '<div class="table-wrap"><table><thead><tr><th>申請番号</th><th>申請日</th><th>申請先</th><th>申請者</th><th>明細数</th><th>ステータス</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>')
    );
  }

  function renderSampleDetail(id, showSubmitted) {
    var user = getCurrentUser();
    var req = sampleStore.get(id);
    if (!req) { mount('<div class="empty-box">申請が見つかりませんでした。</div>'); return; }
    if (!isPlanning(user) && req.createdBy !== user.id) {
      mount('<div class="banner-error">この申請を閲覧する権限がありません。</div>'); return;
    }

    var itemsHtml = req.items.map(function (item, idx) {
      return (
        '<div class="item-detail-card">' +
          '<div class="item-detail-head"><span class="name">明細 ' + (idx + 1) + ': ' + esc(item.productName || "-") + '</span></div>' +
          '<dl class="info-grid cols-4">' +
            '<div><dt>サンプル管理番号</dt><dd>' + esc(item.sampleManagementNo || "-") + '</dd></div>' +
            '<div><dt>メーカーコード</dt><dd>' + esc(item.makerCode || "-") + '</dd></div>' +
            '<div><dt>商品コード</dt><dd>' + esc(item.productCode || "-") + '</dd></div>' +
            '<div><dt>梱包単位</dt><dd>' + esc(item.packingUnit || "-") + '</dd></div>' +
            '<div><dt>依頼数量</dt><dd>' + esc(item.requestQuantity || "-") + '</dd></div>' +
            '<div><dt>依頼単位</dt><dd>' + esc(item.requestUnit || "-") + '</dd></div>' +
            '<div><dt>得意先コード</dt><dd>' + esc(item.customerCode || "-") + '</dd></div>' +
            '<div><dt>得意先名</dt><dd>' + esc(item.customerName || "-") + '</dd></div>' +
            '<div><dt>納入予定価格</dt><dd>' + fmtNum(item.plannedPrice) + '</dd></div>' +
            '<div><dt>納入予定数量</dt><dd>' + esc(item.plannedQuantity || "-") + '</dd></div>' +
            '<div><dt>納入予定日</dt><dd>' + esc(item.plannedDate || "-") + '</dd></div>' +
          '</dl>' +
        '</div>'
      );
    }).join("");

    mount(
      '<a class="back-link" data-link href="#/sample/requests">← 一覧へ戻る</a>' +
      (showSubmitted ? '<div class="banner-success">申請を送信しました。企画側の確認をお待ちください。</div>' : '') +
      '<div class="detail-title-row"><h1>サンプル申請 詳細（' + esc(req.requestNo) + '）</h1><span class="badge ' + req.status + '">' + SIMPLE_STATUS_LABEL[req.status] + '</span></div>' +
      '<section class="panel"><h2>申請情報</h2><dl class="info-grid cols-3">' +
        '<div><dt>申請日</dt><dd>' + esc(req.requestDate || "-") + '</dd></div>' +
        '<div><dt>申請先</dt><dd>' + esc(req.destination || "-") + '</dd></div>' +
      '</dl></section>' +
      '<section class="panel"><h2>申請者・責任者</h2><dl class="info-grid cols-3">' +
        '<div><dt>社員番号</dt><dd>' + esc(req.requesterEmployeeNumber || "-") + '</dd></div>' +
        '<div><dt>氏名</dt><dd>' + esc(req.requesterName || "-") + '</dd></div>' +
        '<div><dt>部署</dt><dd>' + esc(req.requesterDepartment || "-") + '</dd></div>' +
        '<div><dt>責任者コード</dt><dd>' + esc(req.responsibleCode || "-") + '</dd></div>' +
        '<div><dt>責任者名</dt><dd>' + esc(req.responsibleName || "-") + '</dd></div>' +
      '</dl></section>' +
      '<section class="panel"><h2>目的・現況</h2><dl class="info-grid cols-3">' +
        '<div><dt>目的</dt><dd>' + esc(req.purpose === "その他" ? req.purposeOtherText : req.purpose) + '</dd></div>' +
        '<div><dt>現在納入業者</dt><dd>' + esc(req.currentVendor || "-") + '</dd></div>' +
        '<div><dt>現在納入商品【他社競合品名】</dt><dd>' + esc(req.currentProduct || "-") + '</dd></div>' +
      '</dl><div style="margin-top:12px;"><dt class="muted-xs" style="font-weight:600;">特記事項</dt><dd style="margin-top:3px; font-size:13.5px;">' + esc(req.notes || "-") + '</dd></div></section>' +
      '<section class="panel"><h2>サンプル明細</h2><div style="margin-top:16px;">' + itemsHtml + '</div></section>' +
      '<section class="panel"><h2>企画・物流処理</h2>' +
        (isPlanning(user)
          ? '<div id="sample-planning-form" style="margin-top:12px;">' +
              '<div class="grid cols-4" style="margin-bottom:12px;">' +
                '<div>' + fieldLabel("ステータス") + '<select id="sample-status">' +
                  Object.keys(SIMPLE_STATUS_LABEL).map(function (k) { return '<option value="' + k + '"' + (k === req.status ? " selected" : "") + '>' + SIMPLE_STATUS_LABEL[k] + '</option>'; }).join("") +
                '</select></div>' +
                '<div>' + fieldLabel("審査日") + '<input type="date" id="sample-review-date" value="' + esc(req.reviewDate || "") + '" /></div>' +
                '<div>' + fieldLabel("企画処理日") + '<input type="date" id="sample-planning-date" value="' + esc(req.planningProcessedDate || "") + '" /></div>' +
                '<div>' + fieldLabel("物流処理日") + '<input type="date" id="sample-logistics-date" value="' + esc(req.logisticsProcessedDate || "") + '" /></div>' +
              '</div>' +
              '<div class="grid">' +
                '<div>' + fieldLabel("企画コメント") + '<textarea id="sample-planning-comment" rows="3">' + esc(req.planningComment || "") + '</textarea></div>' +
                '<div>' + fieldLabel("物流コメント") + '<textarea id="sample-logistics-comment" rows="3">' + esc(req.logisticsComment || "") + '</textarea></div>' +
              '</div>' +
              '<button type="button" class="btn-secondary" style="margin-top:12px;" id="sample-update-btn">更新</button>' +
            '</div>'
          : '<dl class="info-grid cols-3" style="margin-top:8px;">' +
              '<div><dt>企画コメント</dt><dd>' + esc(req.planningComment || "-") + '</dd></div>' +
              '<div><dt>物流コメント</dt><dd>' + esc(req.logisticsComment || "-") + '</dd></div>' +
              '<div><dt>審査日</dt><dd>' + esc(req.reviewDate || "-") + '</dd></div>' +
              '<div><dt>企画処理日</dt><dd>' + esc(req.planningProcessedDate || "-") + '</dd></div>' +
              '<div><dt>物流処理日</dt><dd>' + esc(req.logisticsProcessedDate || "-") + '</dd></div>' +
            '</dl>') +
      '</section>'
    );

    var updateBtn = document.getElementById("sample-update-btn");
    if (updateBtn) {
      updateBtn.addEventListener("click", function () {
        var current = sampleStore.get(id);
        current.status = document.getElementById("sample-status").value;
        current.reviewDate = document.getElementById("sample-review-date").value;
        current.planningProcessedDate = document.getElementById("sample-planning-date").value;
        current.logisticsProcessedDate = document.getElementById("sample-logistics-date").value;
        current.planningComment = document.getElementById("sample-planning-comment").value;
        current.logisticsComment = document.getElementById("sample-logistics-comment").value;
        current.updatedAt = new Date().toISOString();
        sampleStore.upsert(current);
        renderSampleDetail(id, false);
      });
    }
  }

  // ================= Router =================

  function router() {
    renderNav();
    var user = getCurrentUser();
    var hash = location.hash || "#/";
    var withoutHash = hash.slice(1);
    var qIndex = withoutHash.indexOf("?");
    var path = qIndex >= 0 ? withoutHash.slice(0, qIndex) : withoutHash;
    var query = qIndex >= 0 ? withoutHash.slice(qIndex + 1) : "";
    var params = new URLSearchParams(query);

    if (path !== "/login" && !user) { location.hash = "#/login"; return; }
    if (path === "/login" && user) { location.hash = "#/"; return; }

    var appEl = document.getElementById("app");

    if (path === "/login") { appEl.className = "center-main"; renderAuthView(); window.scrollTo(0, 0); return; }
    appEl.className = "";

    var tokkaDetail = path.match(/^\/tokka\/requests\/([^/]+)$/);
    var fuguaiDetail = path.match(/^\/fuguai\/requests\/([^/]+)$/);
    var sampleDetail = path.match(/^\/sample\/requests\/([^/]+)$/);

    if (path === "/" || path === "") renderMainMenu();
    else if (path === "/tokka/new") renderTokkaNew();
    else if (path === "/tokka/requests") renderTokkaList();
    else if (tokkaDetail) renderTokkaDetail(decodeURIComponent(tokkaDetail[1]), params.get("submitted") === "1");
    else if (path === "/fuguai/new") renderFuguaiNew();
    else if (path === "/fuguai/requests") renderFuguaiList();
    else if (fuguaiDetail) renderFuguaiDetail(decodeURIComponent(fuguaiDetail[1]), params.get("submitted") === "1");
    else if (path === "/sample/new") renderSampleNew();
    else if (path === "/sample/requests") renderSampleList();
    else if (sampleDetail) renderSampleDetail(decodeURIComponent(sampleDetail[1]), params.get("submitted") === "1");
    else renderMainMenu();

    window.scrollTo(0, 0);
  }

  seedDemoUsersIfMissing();
  window.addEventListener("hashchange", router);
  window.addEventListener("DOMContentLoaded", router);
  router();
})();
</script>
</body>
</html>
